# Hourly: fetch the public RRC leaderboards listed in competitions.yml and publish
# the data + site to the gh-pages branch (served by GitHub Pages).
# A commit is only made when something actually changed.
name: Update leaderboards

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["competitions.yml", "site/**", "src/**", ".github/workflows/update.yml"]

permissions:
  contents: write

concurrency:
  group: update-leaderboards
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: out
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install .
      - name: Mirror leaderboards
        id: mirror
        # Keep going on errors so the other leaderboards are still published; fail at the end.
        continue-on-error: true
        run: rrc-mirror --config competitions.yml --out out --site site
      - name: Commit and push changes
        working-directory: out
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -q -m "Update leaderboards $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q origin HEAD:gh-pages
          fi
      - name: Report mirror errors
        if: steps.mirror.outcome == 'failure'
        run: |
          cat out/data/status.json
          exit 1
