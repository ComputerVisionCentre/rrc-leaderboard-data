[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rrc-leaderboard"
version = "0.1.0"
description = "Mirror public Robust Reading Competition (rrc.cvc.uab.es) leaderboards into CSV/JSON"
readme = "README.md"
requires-python = ">=3.10"
license = "CC-BY-4.0"
license-files = ["LICENSE"]
dependencies = ["requests>=2.28", "beautifulsoup4>=4.11", "PyYAML>=6", "certifi", "cryptography>=40"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
rrc-mirror = "rrc_leaderboard.mirror:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rrc_leaderboard = ["certs/*.pem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
