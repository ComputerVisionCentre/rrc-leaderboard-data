# Example workflow for a *competition* repository (copy to .github/workflows/plots.yml there).
# Regenerates the competition's own plots from the shared mirror and publishes them with
# the competition's GitHub Pages site. Adjust paths to your site layout.
name: Leaderboard plots

on:
  schedule:
    - cron: "40 * * * *"   # the mirror updates at :17; run a bit later
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "rrc-leaderboard[plots] @ git+https://github.com/ComputerVisionCentre/rrc-leaderboard-data"
      - run: python scripts/plots.py --competition docvqa-2026 --task 1 --out site/figures
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
